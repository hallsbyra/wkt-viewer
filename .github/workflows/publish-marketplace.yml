name: Publish Marketplace

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish, usually a release tag.
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish, usually a release tag.
        required: true
        default: main

permissions:
  contents: read

jobs:
  publish-marketplace:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests (headless)
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::Missing VSCE_PAT repository secret"
            exit 1
          fi

          npx vsce publish --packagePath ./*.vsix
